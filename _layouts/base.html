<!DOCTYPE html>
<html>
  <head>
    <title>{{ page.title | default: "Super Benji Official | Super Benji Show, Movies, Games, and Comics" }}</title>
    <link rel="icon" href="/favicon.png">
    <meta charset="UTF-8" />
    <meta name="description" content="{{ page.description | default: 'Explore the official Super Benji universe, including the show, movies, games, comics, the League of Grace, and Dr. Banana.' | escape }}">
    <!-- <link rel="manifest" href="manifest.json" /> -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />

    <link rel="stylesheet" href="/bootstrap.min.css">
    <script src="/jquery.min.js" defer></script>
    <script src="/bootstrap.min.js" defer></script>

    <link rel="stylesheet" href="/main.css">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <meta property="og:site_name" content="Super Benji Official">
    <meta property="og:title" content="{{ page.title | default: 'Super Benji Official' | escape }}">
    <meta property="og:description" content="{{ page.description | default: 'Explore the official Super Benji universe, including the show, movies, games, comics, the League of Grace, and Dr. Banana.' | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:type" content="{% if page.story_chapter %}article{% else %}website{% endif %}">
    <meta name="twitter:card" content="summary">
    <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "TVSeries",
  "name": "Super Benji Show",
  "url": "{{ site.url }}",
  "creator": {
    "@type": "Organization",
    "name": "Family Comics Studios"
  },
  "sameAs": [
    "https://www.youtube.com/@SuperBenjiOfficial",
    "https://x.com/SuperBenjiShow",
    "https://super-benji.fandom.com/wiki/Super_Benji_Wiki"
  ],
  "description": "The Super Benji Show is an animated series and movie trilogy created by triangle5820 and themadpunter. Explore comics, games, and in-depth lore from the Super Benji universe."
}
    </script>
    {% if page.story_chapter %}
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Article",
      "headline": {{ page.title | jsonify }},
      "description": {{ page.description | jsonify }},
      "url": {{ page.url | absolute_url | jsonify }},
      "inLanguage": "en",
      "position": {{ page.story_position }},
      "isPartOf": {
        "@type": "CollectionPage",
        "name": "Super Benji Story",
        "url": "{{ '/story/' | absolute_url }}"
      },
      "publisher": {
        "@type": "Organization",
        "name": "Family Comics Studios"
      }
    }
    </script>
    {% endif %}

  </head>
  <body>
    <div class="page-container">
      <header>
        <h1>Super Benji Official Site</h1>
        <nav>
          <a class="navlink" href="/">Home</a> - 
          <a class="navlink" href="/animation/">Animation</a> -
          <a class="navlink" href="/games/">Games</a> -
          <a class="navlink" href="/books/">Books & Comics</a> -
          <a class="navlink" href="/superbenjiweb/">Super Benji Web</a> -
          <a class="navlink" href="/othercontent/">Extra Content</a>
        </nav>
      </header>
      <div class="main">
        {{ content }}
        <footer>
        <small>
            <p>&copy 2026 FC Studios</p>
            <a href="https://discord.com/invite/3D26R47E">Discord</a> <a href="https://www.youtube.com/@SuperBenjiOfficial">YouTube</a> <a href="https://x.com/SuperBenjiShow">X/Twitter</a>
        </small>
        </footer>
      </div>
    </div>
  </body>
</html>
